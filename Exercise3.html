<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise3</title>
    <style>
        *{
            box-sizing: border-box;
        }

        body {
            margin: 0;


        }

        .container {
            display: flex;
            flex-direction: column;
            /* height: 100vh; */
            margin-top: 20px;
            gap: 10px;
            border: 1px solid black;
            /* background-color: antiquewhite; */
            justify-content:space-between;
            align-items: center;



        }

        .header {
            
            display: flex;
            height: 5vh;
            width: 100vh;
            justify-content: center;
            color: aliceblue;
            /* border: 1px solid black; */
            align-items: center;
            background-color: rgba(0, 0, 0, 0.786);
            flex-grow: 1;

        }

        .main {
             display: flex;
            height: 5vh;
            width: 60vh;
            justify-content: center;
            color: rgb(0, 0, 0);
            /* border: 1px solid black; */
            align-items: center;
            background-color: rgba(255, 248, 248, 0.786);
            flex-grow: 1;

            
        }

        .side {
            display: flex;
            height: 5vh;
            width: 60vh;
            justify-content: center;
            color: rgb(0, 0, 0);
            /* border: 1px solid black; */
            align-items: center;
            background-color: rgba(243, 243, 243, 0.786);
            flex-grow: 1;

        }

        .fooder {
            
            display: flex;
            height: 5vh;
            width: 100vh;
            justify-content: center;
            color: aliceblue;
            /* border: 1px solid black; */
            align-items: center;
            background-color: rgba(0, 0, 0, 0.867);
            flex-grow: 1;

        }

        @media (max-width:600px) {
            .header {
                flex-direction: column;
            }
         .side {
                flex-direction: column;
            }
        }

        @media (min-width:600px)and(max-width:900px) {
        .main, .side {
             flex-shrink: 1;             
             min-width: 0; 
             flex-direction: row;   
            grid-template-rows: repeat(2,1fr);
            display: inline;

  }

        }



        </style>
</head>
<body>
    <div class="container"> 
        <div class="header">Respontive Header</div>
        <div class="main">Main Contain</div>
        <div class="side">Sidebar</div>
        <div class="fooder">Footer</div>
        </div>
    
</body>
</html>
